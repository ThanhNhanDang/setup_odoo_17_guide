; project_domain = {project_domain}
; odoo_version = {odoo_version}
; NOTE: ASCII-only comments. Python configparser on Windows reads with cp1252
; and crashes on UTF-8 diacritics (byte 0x90 UnicodeDecodeError).
[options]
addons_path = {addons_path}
admin_passwd = {admin_passwd}
http_port = {http_port}
http_interface = 127.0.0.1
http_enable = True
gevent_port = {gevent_port}
db_host = {db_host}
db_port = {db_port}
db_user = {db_user}
db_password = {db_password}
db_maxconn = 128
db_sslmode = prefer
db_template = template0
data_dir = {data_dir}
list_db = {list_db}
dbfilter = {dbfilter}

; Logging
log_level = {log_level}
log_handler = {log_handler}
log_db_level = warning

; Workers=0 on Windows (prefork unsupported). Linux prod may increase to 2+.
workers = {workers}

; Worker limits (apply only when workers>0).
; 1h CPU / 2h wall matches nginx 24h proxy timeout for heavy tasks
; (module install, DB restore, bulk import). Lower to 600/1200 for prod.
limit_memory_soft = {limit_memory_soft}
limit_memory_hard = {limit_memory_hard}
limit_time_cpu = 3600
limit_time_real = 7200
limit_request = 8192

; proxy_mode=True when behind nginx; False when direct HTTP.
proxy_mode = {proxy_mode}

; Dev hot-reload XML/QWeb. Clear this value for prod builds.
dev_mode = reload,qweb,xml

server_wide_modules = {server_wide_modules}
unaccent = True
csv_internal_sep = ,
transient_age_limit = 1.0
