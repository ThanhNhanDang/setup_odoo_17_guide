; project_domain = {project_domain}
; odoo_version = {odoo_version}
[options]
addons_path = {addons_path}
admin_passwd = {admin_passwd}
http_port = {http_port}
http_interface = 127.0.0.1
http_enable = True
gevent_port = {gevent_port}
db_host = {db_host}
db_port = {db_port}
db_user = {db_user}
db_password = {db_password}
db_maxconn = 8
db_sslmode = prefer
db_template = template0
data_dir = {data_dir}
list_db = {list_db}
dbfilter = {dbfilter}

; --- Logging ---
log_level = {log_level}
log_handler = {log_handler}
log_db_level = warning

; --- Workers: 0 trên Windows (prefork không chạy native). Linux prod có thể tăng lên 2+ ---
workers = {workers}

; --- Giới hạn worker ---
; limit_time_cpu/real chỉ áp dụng khi workers>0 (prefork, Linux).
; 3600s (1h) CPU / 7200s (2h) wall — đủ cho install module lớn, migration,
; DB backup/restore, import nhiều triệu dòng. Match với nginx proxy timeout.
; Giảm xuống 600/1200 cho prod production để tránh request treo lâu.
limit_memory_soft = {limit_memory_soft}
limit_memory_hard = {limit_memory_hard}
limit_time_cpu = 3600
limit_time_real = 7200
limit_request = 8192

; --- Reverse proxy: True khi chạy sau nginx, False khi chạy trực tiếp ---
proxy_mode = {proxy_mode}

; --- Dev: hot-reload XML/QWeb (xóa khi build prod) ---
dev_mode = reload,qweb,xml

server_wide_modules = {server_wide_modules}
unaccent = True
csv_internal_sep = ,
transient_age_limit = 1.0
