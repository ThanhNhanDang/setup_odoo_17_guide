appId: com.odoo17.installer
productName: "Odoo 17 Installer"
directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - src/renderer/**/*
  - templates/**/*

extraResources:
  - from: templates
    to: templates
  - from: resources/icon.ico
    to: icon.ico

win:
  target:
    - target: portable
    - target: nsis
    - target: dir
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  signDlls: false

forceCodeSigning: false

portable:
  artifactName: "Odoo17Installer.exe"

nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Odoo 17 Installer"

asar: true

publish:
  provider: github
  owner: ThanhNhanDang
  repo: setup_odoo_17_guide
