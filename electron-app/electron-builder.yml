appId: com.odoo17.installer
productName: "Odoo 17 Installer"
directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - src/renderer/**/*
  - templates/**/*

extraResources:
  - from: templates
    to: templates
  - from: resources/icon.ico
    to: icon.ico

win:
  target:
    - target: portable
    - target: nsis
    - target: dir
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  signDlls: false

forceCodeSigning: false

portable:
  artifactName: "Odoo17Installer.exe"

nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Odoo 17 Installer"

asar: true

# Auto-update: configure your publish target
# Option 1: GitHub Releases (recommended)
# publish:
#   provider: github
#   owner: your-github-username
#   repo: your-repo-name
#
# Option 2: Generic server (any HTTP file host)
# publish:
#   provider: generic
#   url: https://your-server.com/updates/
#
# After configuring, run: npm run dist -- --publish always
# This uploads release artifacts + generates latest.yml for auto-updater
