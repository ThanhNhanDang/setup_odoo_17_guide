<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#010101"/>
    </linearGradient>
  </defs>
  <!-- Dark circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Purple accent ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#713589" stroke-width="16"/>
  <!-- AUTO text -->
  <text x="256" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="108" fill="white" letter-spacing="4">AUTO</text>
  <!-- & symbol in purple -->
  <text x="168" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="80" fill="#713589">&amp;</text>
  <!-- SI text -->
  <text x="320" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="108" fill="#7e7e7e" letter-spacing="4">SI</text>
</svg>
