<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Monitor</title>
<link rel="stylesheet" href="styles/log-viewer.css">
</head>
<body>
<div class="titlebar">
  <span class="titlebar-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <select id="projectSelect" class="project-select" onchange="switchProject(this.value)" title="Switch project">
      <option id="windowTitle">Project Monitor</option>
    </select>
  </span>
  <div class="titlebar-controls">
    <button onclick="togglePin()" id="btnPin" class="pin-btn" title="Always on top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 2h6l-1.5 5.5L17 11H7l3.5-3.5z"/></svg>
    </button>
    <button onclick="minimizeWindow()" title="Minimize">
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button onclick="maximizeWindow()" id="btnMaximize" title="Maximize">
      <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
    </button>
    <button class="close" onclick="window.close()" title="Close">&#10005;</button>
  </div>
</div>
<div class="status-bar">
  <div style="display:flex;align-items:center;gap:6px">
    <span class="status-dot idle" id="statusDot"></span><span id="statusText">Waiting...</span>
    <span style="margin-left:6px;border-left:1px solid var(--border);padding-left:8px;display:flex;align-items:center;gap:4px">
      <span class="status-dot idle" id="serverDot"></span><span id="serverStatus">Checking...</span>
    </span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;min-width:0">
    <div id="logPath" style="opacity:0.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
    <span class="line-count" id="lineCount">0 lines</span>
  </div>
</div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-btn active" id="tabBtnLog" onclick="switchTab('log')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
    <span data-tab-label="log">Log</span>
  </button>
  <button class="tab-btn" id="tabBtnDatabase" onclick="switchTab('database')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
    <span data-tab-label="database">Database</span>
  </button>
</div>

<!-- Tab: Log -->
<div class="tab-content active" id="tabLog">
<div class="main-content">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <!-- Edge toggle button — docked on right border -->
    <button onclick="toggleSidebar()" class="sidebar-edge-toggle" id="btnSidebar" title="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="sidebar-header">
      <span class="sidebar-header-title" id="sidebarTitle">Config</span>
    </div>

    <!-- Action buttons -->
    <div class="sidebar-actions">
      <button class="restart-btn" id="btnRestart" onclick="saveAndRestart()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        <span id="restartLabel">Save &amp; Restart</span>
      </button>
      <button class="browser-btn" id="btnOpenBrowser" onclick="openBrowserFromMonitor()" title="Open in browser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
      </button>
    </div>

    <!-- Log Level -->
    <div class="sidebar-section">
      <div class="sidebar-section-title">
        <span id="logLevelLabel">Log Level</span>
        <svg class="help-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             onmouseenter="showTooltip(event,'helpLogLevel')" onmouseleave="hideTooltip()">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <select class="log-level-select" id="logLevelSelect">
        <option value="critical">critical</option>
        <option value="error">error</option>
        <option value="warn">warn</option>
        <option value="info">info</option>
        <option value="debug">debug</option>
        <option value="debug_rpc">debug_rpc</option>
        <option value="debug_sql">debug_sql</option>
        <option value="debug_rpc_answer">debug_rpc_answer</option>
      </select>
    </div>

    <!-- Module Upgrade -->
    <div class="sidebar-section" style="flex-shrink:0">
      <div class="sidebar-section-title">
        <span id="upgradeLabel">Upgrade Modules</span>
        <svg class="help-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             onmouseenter="showTooltip(event,'helpUpgrade')" onmouseleave="hideTooltip()">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <div class="module-actions" id="moduleActions" style="display:none">
        <button onclick="selectAllModules()" id="btnSelectAll">Select All</button>
        <button onclick="deselectAllModules()" id="btnDeselectAll">Deselect All</button>
      </div>
    </div>

    <!-- Module list (scrollable) -->
    <div class="module-list-area" id="moduleListArea">
      <div class="no-modules" id="noModulesMsg">No custom modules found</div>
    </div>
    <div class="module-count" id="moduleCount" style="padding:4px 10px;border-top:1px solid var(--border);display:none"></div>
  </div>

  <!-- Log panel -->
  <div class="log-panel">
    <!-- Floating controls — top-right -->
    <div class="log-fab-group">
      <button onclick="clearLog()" class="log-fab" title="Clear log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
        Clear
      </button>
      <button onclick="toggleAutoScroll()" id="btnAutoScroll" class="log-fab active" title="Auto-scroll">
        <span class="fab-dot"></span> Scroll
      </button>
      <button onclick="toggleHighlight()" id="btnHighlight" class="log-fab active" title="Highlight log levels">
        <span class="fab-dot"></span> Highlight
      </button>
    </div>
    <div class="log-container" id="logBox"></div>
  </div>
</div>


</div><!-- /tabLog -->

<!-- Tab: Database -->
<div class="tab-content" id="tabDatabase">
<div class="db-container">
  <div class="db-conn-info" id="dbConnInfo">
    <span id="dbConnLabel">Connection:</span>
    <div class="db-conn-tag"><strong>host</strong>&nbsp;<span id="dbHost">-</span></div>
    <div class="db-conn-tag"><strong>port</strong>&nbsp;<span id="dbPort">-</span></div>
    <div class="db-conn-tag"><strong>user</strong>&nbsp;<span id="dbUser">-</span></div>
  </div>
  <div class="db-toolbar">
    <button class="db-toolbar-btn primary" onclick="showCreateDbModal()" id="btnCreateDb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Create DB</span>
    </button>
    <button class="db-toolbar-btn" onclick="showRestoreDbModal()" id="btnRestoreDb">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Restore DB</span>
    </button>
    <button class="db-toolbar-btn" onclick="loadDatabases()" id="btnRefreshDb" title="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      <span id="dbRefreshLabel">Refresh</span>
    </button>
  </div>
  <div class="db-table-wrap" id="dbTableWrap">
    <div class="db-empty" id="dbEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
      <div id="dbEmptyMsg">Switch to Database tab to load databases</div>
    </div>
  </div>
</div>
</div><!-- /tabDatabase -->

            <option value="sk">Slovakia</option><option value="si">Slovenia</option><option value="so">Somalia</option>
            <option value="za">South Africa</option><option value="kr">South Korea</option><option value="ss">South Sudan</option>
            <option value="es">Spain</option><option value="lk">Sri Lanka</option><option value="sd">Sudan</option>
            <option value="se">Sweden</option><option value="ch">Switzerland</option><option value="sy">Syria</option>
            <option value="tw">Taiwan</option><option value="tj">Tajikistan</option><option value="tz">Tanzania</option>
            <option value="th">Thailand</option><option value="tl">Timor-Leste</option><option value="tg">Togo</option>
            <option value="tn">Tunisia</option><option value="tr">Türkiye</option><option value="tm">Turkmenistan</option>
            <option value="ug">Uganda</option><option value="ua">Ukraine</option><option value="ae">United Arab Emirates</option>
            <option value="gb">United Kingdom</option><option value="us">United States</option><option value="uy">Uruguay</option>
            <option value="uz">Uzbekistan</option><option value="ve">Venezuela</option><option value="vn">Vietnam</option>
            <option value="ye">Yemen</option><option value="zm">Zambia</option><option value="zw">Zimbabwe</option>
          </select>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
        <input type="checkbox" id="createDbDemo" style="width:auto;margin:0;accent-color:var(--header-bg)">
        <label for="createDbDemo" id="createDbDemoLabel" style="margin:0;cursor:pointer">Demo Data</label>
      </div>
      <div style="font-size:0.68rem;color:var(--text-dim);margin-bottom:8px;line-height:1.4" id="createDbHint">Creates database and initializes Odoo schema. Takes 2-5 minutes.</div>
    </div>
    <div class="db-modal-actions" id="createDbActions">
      <button class="db-toolbar-btn" onclick="hideDbModal('modalCreateDb')" id="createDbCancelBtn">Cancel</button>
      <button class="db-toolbar-btn primary" onclick="doCreateDb()" id="btnDoCreateDb">Create</button>
    </div>
  </div>
</div>

<!-- Restore DB Modal -->
<div class="db-modal-overlay" id="modalRestoreDb">
  <div class="db-modal">
    <h3 id="restoreDbTitle">Restore Database</h3>
    <div class="db-msg" id="restoreDbMsg"></div>
    <div id="restoreDbForm">
      <label id="restoreDbPasswdLabel">Master Password</label>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        <input type="text" id="restoreDbPasswd" readonly style="margin-bottom:0;flex:1;opacity:0.7">
        <button class="db-toolbar-btn" onclick="navigator.clipboard.writeText(document.getElementById('restoreDbPasswd').value)" style="flex-shrink:0;padding:5px 8px" title="Copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        </button>
      </div>
      <label id="restoreDbNameLabel">Database name</label>
      <div class="db-name-input-wrap">
        <span class="db-name-prefix" id="restoreDbPrefix"></span>
        <input type="text" id="restoreDbName" placeholder="my_database" autocomplete="off">
      </div>
      <label id="restoreDbFileLabel">Backup file (.zip, .dump, .sql)</label>
      <div style="display:flex;gap:6px;margin-bottom:10px">
        <input type="text" id="restoreDbFile" placeholder="Select file..." readonly style="margin-bottom:0;flex:1;cursor:pointer" onclick="pickRestoreFile()">
        <button class="db-toolbar-btn" onclick="pickRestoreFile()" style="flex-shrink:0">Browse</button>
      </div>
    </div>
    <div class="db-modal-actions" id="restoreDbActions">
      <button class="db-toolbar-btn" onclick="hideDbModal('modalRestoreDb')" id="restoreDbCancelBtn">Cancel</button>
      <button class="db-toolbar-btn primary" onclick="doRestoreDb()" id="btnDoRestoreDb">Restore</button>
    </div>
  </div>
</div>

<!-- Drop DB Confirm Modal -->
<div class="db-modal-overlay" id="modalDropDb">
  <div class="db-modal">
    <h3 id="dropDbTitle">Drop Database</h3>
    <div class="db-msg" id="dropDbMsg"></div>
    <p style="font-size:0.75rem;color:var(--text);margin-bottom:12px" id="dropDbConfirmText">Are you sure?</p>
    <input type="text" id="dropDbConfirmInput" placeholder="Type database name to confirm" autocomplete="off">
    <div class="db-modal-actions">
      <button class="db-toolbar-btn" onclick="hideDbModal('modalDropDb')">Cancel</button>
      <button class="db-toolbar-btn danger" onclick="doDropDb()" id="btnDoDropDb">Drop</button>
    </div>
  </div>
</div>

<!-- Tooltip element -->
<div class="tooltip" id="tooltip" style="display:none"></div>

<script src="scripts/log-viewer.js"></script>
</body>
</html>
